<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbfaf6">
  <title>Анкета — WhereToMove</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #fbfaf6; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  </style>
</head>
<body>
  <iframe title="Анкета WhereToMove" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const appOrigin = 'https://app.wheretomovebot.com:8443'
    const frame = document.querySelector('iframe')
    const knownLanguage = value => value === 'ru' || value === 'en'
    let isShared = false

    function displayLanguage(language) {
      document.documentElement.lang = language
      if (language === 'en') {
        frame.title = isShared ? 'Shared WhereToMove shortlist' : 'WhereToMove questionnaire'
        document.title = isShared ? 'Shared shortlist — WhereToMove' : 'Questionnaire — WhereToMove'
      } else {
        frame.title = isShared ? 'Общий список городов WhereToMove' : 'Анкета WhereToMove'
        document.title = isShared ? 'Общий список городов — WhereToMove' : 'Анкета — WhereToMove'
      }
    }

    function openPage() {
      const pageUrl = new URL(location.href)
      const language = pageUrl.searchParams.get('lang')
      const sharedId = new URLSearchParams(pageUrl.hash.slice(1)).get('shared')
      isShared = !!sharedId && /^[A-Za-z0-9_-]{1,128}$/.test(sharedId)
      const appUrl = new URL(appOrigin)
      if (isShared) appUrl.searchParams.set('shared', sharedId)
      else appUrl.searchParams.set('view', 'survey')
      if (knownLanguage(language)) appUrl.searchParams.set('lang', language)
      displayLanguage(language === 'en' ? 'en' : 'ru')
      frame.src = appUrl.href
    }

    addEventListener('message', event => {
      if (event.origin !== appOrigin || event.source !== frame.contentWindow) return
      if (event.data?.type !== 'wheretomove:language' || !knownLanguage(event.data.language)) return
      displayLanguage(event.data.language)
      const pageUrl = new URL(location.href)
      if (pageUrl.searchParams.get('lang') !== event.data.language) {
        pageUrl.searchParams.set('lang', event.data.language)
        history.replaceState(history.state, '', pageUrl)
      }
    })

    addEventListener('hashchange', openPage)
    openPage()
  </script>
  <noscript>
    <p lang="ru">Для анкеты нужно включить JavaScript.</p>
    <p lang="en">Enable JavaScript to use the questionnaire.</p>
  </noscript>
</body>
</html>
