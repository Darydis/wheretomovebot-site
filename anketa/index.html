<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbfaf6">
  <title>Анкета — WhereToMove</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #fbfaf6; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  </style>
</head>
<body>
  <iframe title="Анкета WhereToMove" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const frame = document.querySelector('iframe')
    const shared = new URLSearchParams(location.hash.slice(1)).get('shared')
    if (shared && /^[A-Za-z0-9_-]{1,128}$/.test(shared)) {
      frame.src = 'https://app.wheretomovebot.com:8443/?shared=' + encodeURIComponent(shared)
      document.title = 'Общий список городов — WhereToMove'
    } else {
      frame.src = 'https://app.wheretomovebot.com:8443/?view=survey'
    }
  </script>
  <noscript><p>Для анкеты нужно включить JavaScript.</p></noscript>
</body>
</html>
